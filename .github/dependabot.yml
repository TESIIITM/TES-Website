version: 2
updates:
  # Dependabot's npm ecosystem also maintains pnpm lockfiles.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
      supabase:
        patterns: ['@supabase/*', 'supabase']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
