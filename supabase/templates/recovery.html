<h2>Reset your TES dashboard password</h2>
<p>Someone asked to reset the password for {{ .Email }}.</p>
<p><a href="{{ .SiteURL }}/admin/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Choose a new password</a></p>
<p>The link works once and expires after an hour. If you did not ask for this, you can ignore it.</p>
