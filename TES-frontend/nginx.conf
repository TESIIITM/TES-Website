server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  expires -1;
  # Keep every add_header at server scope: location-level add_header disables inheritance.
  # Motion/Radix use inline styles; scripts and fonts remain restricted to local files.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  location / { try_files $uri $uri/ /index.html; }
  location ~* ^/assets/(?:index-|inter-).+\.(?:js|css|woff2)$ {
    expires 1y;
    try_files $uri =404;
  }
  location ~* \.(?:png|jpg|jpeg|svg)$ {
    expires 7d;
    try_files $uri =404;
  }
}
